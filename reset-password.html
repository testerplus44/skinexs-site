<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Новый пароль — Skinexs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="auth-body">
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="site-header">
    <div class="container header-inner">
      <div class="header-left">
        <a class="logo" href="index.html">
          <span class="logo-mark">S</span>
          <span class="logo-text">Skinexs</span>
        </a>
        <nav class="nav nav-primary" aria-label="Основное меню">
          <a href="index.html#catalog">Каталог</a>
          <a href="support.html">Поддержка</a>
          <a href="reviews.html">Отзывы</a>
        </nav>
      </div>
      <div class="header-actions">
        <button type="button" class="btn btn-ghost cart-toggle" id="cartBtn" aria-label="Корзина">
          <span class="cart-icon" aria-hidden="true"></span>
          <span class="cart-label">Корзина</span>
          <span class="cart-count" id="cartCount">0</span>
        </button>
        <div class="header-auth" aria-label="Вход и личный кабинет">
          <div class="header-auth-slot">
            <span id="userNavSlot" class="user-nav-slot"></span>
            <span id="adminNavSlot" class="admin-nav-slot"></span>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="auth-main cs-scope">
    <div class="container container-narrow">
      <div class="auth-card">
        <h1 class="auth-title">Новый пароль</h1>
        <p class="auth-lead auth-lead--compact" id="resetLead">Задайте новый пароль для входа по email.</p>
        <form id="formReset" class="auth-form" novalidate hidden>
          <label class="field">
            <span>Новый пароль</span>
            <input type="password" name="password" id="resetPassword" required autocomplete="new-password" minlength="6" />
          </label>
          <label class="field">
            <span>Повтор пароля</span>
            <input type="password" name="password2" id="resetPassword2" required autocomplete="new-password" minlength="6" />
          </label>
          <button type="submit" class="btn-cs-cart btn-block auth-submit">Сохранить пароль</button>
          <p class="auth-note" id="resetMsg" role="status" aria-live="polite"></p>
        </form>
        <p class="auth-back-wrap"><a href="auth.html" class="auth-forgot-link">← К странице входа</a></p>
      </div>
    </div>
  </main>

  <aside class="drawer" id="cartDrawer" aria-hidden="true" aria-labelledby="cartDrawerTitle">
    <div class="drawer-backdrop" id="cartBackdrop" tabindex="-1"></div>
    <div class="drawer-panel" role="dialog">
      <div class="drawer-head">
        <h2 id="cartDrawerTitle">Корзина</h2>
        <button type="button" class="icon-btn" id="closeCart" aria-label="Закрыть">×</button>
      </div>
      <div class="drawer-body" id="cartItems"></div>
      <div class="drawer-foot">
        <p class="cart-total">Итого: <strong id="cartTotal">0 ₽</strong></p>
        <a class="btn btn-primary btn-block cart-auth-cta" id="cartLoginCta" href="auth.html" hidden>Авторизоваться для оформления заказа</a>
        <button type="button" class="btn btn-primary btn-block" id="checkoutOrder" hidden>Оформить заказ</button>
        <p class="cart-checkout-note" id="cartCheckoutNote" role="status" aria-live="polite"></p>
      </div>
    </div>
  </aside>

  <script src="js/shared.js"></script>
  <script src="js/data.js"></script>
  <script src="js/server-config.js"></script>
  <script src="js/admin-config.js"></script>
  <script src="js/bootstrap-server.js"></script>
  <script src="js/catalog-store.js"></script>
  <script src="js/market-offers-store.js"></script>
  <script src="js/taxonomy.js"></script>
  <script src="js/auth-store.js"></script>
  <script src="js/notifications-store.js"></script>
  <script src="js/account-store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/inject-nav.js"></script>
  <script src="js/notifications-ui.js"></script>
  <script src="js/reset-password-page.js"></script>
</body>
</html>
