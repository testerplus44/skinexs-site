<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml" />
  <meta name="description" content="Карточка товара — Skinexs." id="metaDesc" />
  <title>Товар — Skinexs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="site-header">
    <div class="container header-inner">
      <div class="header-left">
        <a class="logo" href="index.html">
          <span class="logo-mark" aria-hidden="true"><img class="logo-mark-img" src="assets/brand/logo-mark.svg" width="40" height="40" alt="" /></span>
          <span class="logo-text">Skinexs</span>
        </a>
        <nav class="nav nav-primary" aria-label="Основное меню">
          <a href="index.html#catalog">Каталог</a>
          <a href="support.html">Поддержка</a>
          <a href="reviews.html">Отзывы</a>
        </nav>
      </div>
      <div class="header-actions">
        <button type="button" class="btn btn-ghost cart-toggle" id="cartBtn" aria-label="Корзина">
          <span class="cart-icon" aria-hidden="true"></span>
          <span class="cart-label">Корзина</span>
          <span class="cart-count" id="cartCount">0</span>
        </button>
        <div class="header-auth" aria-label="Вход и личный кабинет">
          <div class="header-auth-slot">
            <span id="userNavSlot" class="user-nav-slot"></span>
            <span id="adminNavSlot" class="admin-nav-slot"></span>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="product-main cs-scope">
    <div class="container container-wide">
      <nav class="breadcrumbs product-breadcrumbs" aria-label="Хлебные крошки">
        <a href="index.html">Главная</a>
        <span class="bc-sep" aria-hidden="true">/</span>
        <a href="index.html#catalog">Каталог</a>
        <span class="bc-sep" aria-hidden="true">/</span>
        <span class="bc-current" id="bcTitle">Товар</span>
      </nav>

      <div id="productMount"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p class="footer-brand" id="siteFooterBrand">Skinexs · эксклюзивные сеты Dota 2</p>
      <p class="footer-disclaimer" id="siteFooterDisclaimer">
        Dota и Dota 2 являются товарными знаками Valve Corporation. Сайт не аффилирован с Valve.
      </p>
    </div>
  </footer>

  <aside class="drawer" id="cartDrawer" aria-hidden="true" aria-labelledby="cartDrawerTitle">
    <div class="drawer-backdrop" id="cartBackdrop" tabindex="-1"></div>
    <div class="drawer-panel" role="dialog">
      <div class="drawer-head">
        <h2 id="cartDrawerTitle">Корзина</h2>
        <button type="button" class="icon-btn" id="closeCart" aria-label="Закрыть">×</button>
      </div>
      <div class="drawer-body" id="cartItems"></div>
      <div class="drawer-foot">
        <p class="cart-total">Итого: <strong id="cartTotal">0 ₽</strong></p>
        <a class="btn btn-primary btn-block cart-auth-cta" id="cartLoginCta" href="auth.html" hidden>Авторизоваться для оформления заказа</a>
        <button type="button" class="btn btn-primary btn-block" id="checkoutOrder" hidden>Оформить заказ</button>
        <p class="cart-checkout-note" id="cartCheckoutNote" role="status" aria-live="polite"></p>
      </div>
    </div>
  </aside>

  <script src="js/data.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/server-config.js"></script>
  <script src="js/admin-config.js"></script>
  <script src="js/bootstrap-server.js"></script>
  <script src="js/catalog-store.js"></script>
  <script src="js/taxonomy.js"></script>
  <script src="js/auth-store.js"></script>
  <script src="js/notifications-store.js"></script>
  <script src="js/market-offers-store.js"></script>
  <script src="js/admin-auth.js"></script>
  <script src="js/account-store.js"></script>
  <script src="js/site-settings.js"></script>
  <script src="js/product.js"></script>
  <script src="js/app.js"></script>
  <script src="js/inject-nav.js"></script>
  <script src="js/notifications-ui.js"></script>
  <script>
    if (window.SkinexSiteSettings) SkinexSiteSettings.applyToPage();
  </script>
</body>
</html>
